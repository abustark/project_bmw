<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-GELO — Digital Marketplace for Creators</title>
    <meta name="description" content="Curated digital assets for designers & developers. UI kits, templates, courses, icons and 3D packs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/cart.svg" />
    <!-- SPA for GitHub Pages — decode redirect from 404.html -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Open Graph -->
    <meta property="og:title" content="N-GELO — Digital Marketplace for Creators" />
    <meta property="og:description" content="Curated UI kits, templates, courses, icons & 3D. Built from a BCA major project, now Vue 3 + Vite." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1558655146-d09347e92766?w=1200&q=80&auto=format&fit=crop" />
    <meta name="theme-color" content="#18181b" />
  </head>
  <body class="bg-[#fcfcf9] text-zinc-900 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
